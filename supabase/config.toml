project_id = "storyops-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.provider-webhook]
verify_jwt = false

[functions.lead-intake]
verify_jwt = false

[functions.ai-approved-action]
verify_jwt = true

[functions.golden-path]
verify_jwt = true

[functions.post-service]
verify_jwt = true

[functions.post-service-worker]
verify_jwt = false

[functions.property-geocode]
verify_jwt = true

[functions.identity-provisioning]
verify_jwt = true

[functions.estimate-workflow]
verify_jwt = true

[functions.scope-photo-workflow]
verify_jwt = true

[functions.sds-registration]
verify_jwt = true

[functions.scope-photo-cleanup]
verify_jwt = false

[functions.scheduling-evidence]
verify_jwt = true

[functions.scheduling-suggestions]
verify_jwt = true

[functions.dispatch-clearance]
verify_jwt = true

[functions.scheduling-reconciliation]
verify_jwt = false

[functions.transactional-outbound-worker]
verify_jwt = false

[functions.trusted-pilot-proof]
verify_jwt = true
